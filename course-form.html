<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course | EduPulse Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/app.css">
</head>

<body class="form-body-wrapper">
    <div class="form-top-nav">
        <a href="courses.html" class="back-link">
            <span>&larr;</span> Back to Courses Directory
        </a>
    </div>

    <div class="form-container-card">
        <div class="form-header">
            <div class="form-icon-emblem" style="background: #faf5ff; border-color: #f3e8ff;">
                <img src="images/book-img.svg" alt="Course Icon" style="filter: invert(33%) sepia(87%) saturate(2035%) hue-rotate(264deg) brightness(96%) contrast(93%);">
            </div>
            <h1 class="form-page-title">Add New Course</h1>
            <p class="form-page-subtitle">Define an academic program or curriculum course.</p>
        </div>

        <form class="form-design" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label">
                    Course Code (Numeric) <span class="required-star">*</span>
                </label>
                <input type="text" placeholder="e.g. 106" class="in course-code" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Course / Program Name <span class="required-star">*</span>
                </label>
                <input type="text" placeholder="e.g. Cybersecurity & Cloud Computing" class="in course-name" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Academic Degree Level <span class="required-star">*</span>
                </label>
                <div class="select-items">
                    <label class="item-1">
                        <input type="radio" name="grad" value="under-grad">
                        <span>Under-Graduate</span>
                    </label>
                    <label class="item-2">
                        <input type="radio" name="grad" value="post-grad">
                        <span>Post-Graduate</span>
                    </label>
                </div>
            </div>

            <div class="btn">
                <a href="courses.html" class="cancel-btn">Cancel</a>
                <button type="submit" class="submission">Save & Create Course</button>
            </div>
        </form>
    </div>

    <script src="scripts/course-form.js" type="module"></script>
</body>

</html>
