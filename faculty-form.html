<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Faculty | EduPulse Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/app.css">
</head>

<body class="form-body-wrapper">
    <div class="form-top-nav">
        <a href="faculty.html" class="back-link">
            <span>&larr;</span> Back to Faculty Directory
        </a>
    </div>

    <div class="form-container-card">
        <div class="form-header">
            <div class="form-icon-emblem" style="background: #ecfdf5; border-color: #d1fae5;">
                <img src="images/person-img.svg" alt="Faculty Icon" style="filter: invert(48%) sepia(68%) saturate(674%) hue-rotate(113deg) brightness(92%) contrast(93%);">
            </div>
            <h1 class="form-page-title">Add Faculty Member</h1>
            <p class="form-page-subtitle">Assign an instructor, professor, or department chair.</p>
        </div>

        <form class="form-design" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label">
                    Faculty Full Name <span class="required-star">*</span>
                </label>
                <!-- Retains class .enrollment-no required by faculty-form.js -->
                <input type="text" placeholder="e.g. Dr. Arthur Pendelton" class="in enrollment-no" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Official Email Address <span class="required-star">*</span>
                </label>
                <!-- Retains class .student-name required by faculty-form.js -->
                <input type="email" placeholder="e.g. arthur.pendelton@university.edu" class="in student-name" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Gender <span class="required-star">*</span>
                </label>
                <div class="select-items">
                    <label class="item-1">
                        <input type="radio" name="gen" value="male">
                        <span>Male</span>
                    </label>
                    <label class="item-2">
                        <input type="radio" name="gen" value="female">
                        <span>Female</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    Assigned Course Department <span class="required-star">*</span>
                </label>
                <select class="student-course" required>
                    <!-- Populated dynamically by faculty-form.js -->
                </select>
            </div>

            <div class="btn">
                <a href="faculty.html" class="cancel-btn">Cancel</a>
                <button type="submit" class="submission">Save & Register Faculty</button>
            </div>
        </form>
    </div>

    <script src="scripts/faculty-form.js" type="module"></script>
</body>

</html>
